name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Build-Managed:
    runs-on: windows-latest
    steps:
    - name: Source checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Prepare .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: Build and analyze
      run: dotnet build .\Managed\KNSoft.FirmwareSpec.Tests\KNSoft.FirmwareSpec.Tests.csproj -c Release
    - name: Run tests
      run: dotnet run --project .\Managed\KNSoft.FirmwareSpec.Tests\KNSoft.FirmwareSpec.Tests.csproj -c Release --no-build
    - name: Validate NuGet package
      run: dotnet pack .\Managed\KNSoft.FirmwareSpec\KNSoft.FirmwareSpec.csproj -c Release --no-build

  Build-Windows-MSVC:
    strategy:
      matrix:
        platform: [x64, x86, ARM64]
        config: [Debug, Release]
      fail-fast: false
    runs-on: windows-latest
    steps:
    - name: Source checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Prepare MSBuild
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
    - name: Build
      run: msbuild .\VSProject\KNSoft.FirmwareSpec.sln /restore /m /p:Configuration=${{matrix.config}} /p:Platform=${{matrix.platform}} /p:RestorePackagesConfig=true /p:RunCodeAnalysis=true /p:EnableCppCodeAnalysis=true /p:CodeAnalysisTreatWarningsAsErrors=true
    - name: Run sample programs
      if: ${{matrix.platform == 'x64' || matrix.platform == 'x86'}}
      run: |
        & .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\FirmwareSpecTest.exe
        & .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\AcpiDecode.exe >.\AcpiDecode.txt
        & .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\CpuidDecode.exe >.\CpuidDecode.txt
        & .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\SmbiosDecode.exe >.\SmbiosDecode.txt
        Get-Content .\AcpiDecode.txt
        Get-Content .\CpuidDecode.txt
        Get-Content .\SmbiosDecode.txt
    - name: Archive sample programs and outputs
      if: ${{matrix.platform == 'x64' || matrix.platform == 'x86'}}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: KNSoft.FirmwareSpec-Windows-MSVC-${{matrix.platform}}-${{matrix.config}}-${{github.sha}}
        path: |
          .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\AcpiDecode.exe
          .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\CpuidDecode.exe
          .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\FirmwareSpecTest.exe
          .\VSProject\OutDir\${{matrix.platform}}\${{matrix.config}}\SmbiosDecode.exe
          .\AcpiDecode.txt
          .\CpuidDecode.txt
          .\SmbiosDecode.txt
        if-no-files-found: error

  Build-Linux-GCC:
    runs-on: ubuntu-latest
    steps:
    - name: Source checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Build
      run: |
        gcc -std=gnu2x -Wall -Wextra -Werror -fdiagnostics-color=always -g ./SmbiosDecode.c -o SmbiosDecode
        gcc -std=gnu2x -Wall -Wextra -Werror -fdiagnostics-color=always -g ./AcpiDecode.c -o AcpiDecode
        gcc -std=gnu2x -Wall -Wextra -Werror -fdiagnostics-color=always -g ./CpuidDecode.c -o CpuidDecode
        gcc -std=gnu2x -Wall -Wextra -Werror -fdiagnostics-color=always -g ./FirmwareSpecTest.c -o FirmwareSpecTest
        gcc -std=gnu2x -Wall -Wextra -Werror -fdiagnostics-color=always -g \
          ./Managed/GenerateSmbiosMetadata.c -o GenerateSmbiosMetadata
    - name: Verify managed SMBIOS metadata
      run: |
        ./GenerateSmbiosMetadata >./SmbiosMetadata.g.cs
        sed 's/\r$//' ./Managed/KNSoft.FirmwareSpec/SmbiosMetadata.g.cs | cmp ./SmbiosMetadata.g.cs
    - name: Run sample programs
      run: |
        set -o pipefail
        ./FirmwareSpecTest
        if sudo test -r /sys/firmware/acpi/tables/FACP; then
          sudo ./AcpiDecode /sys/firmware/acpi/tables/FACP | tee ./AcpiDecode.txt
        else
          sudo ./AcpiDecode | tee ./AcpiDecode.txt
        fi
        ./CpuidDecode >./CpuidDecode.txt
        sudo ./SmbiosDecode >./SmbiosDecode.txt
        cat ./CpuidDecode.txt
        cat ./SmbiosDecode.txt
    - name: Archive sample programs and outputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: KNSoft.FirmwareSpec-Linux-GCC-${{github.sha}}
        path: |
          ./AcpiDecode
          ./AcpiDecode.txt
          ./CpuidDecode
          ./CpuidDecode.txt
          ./FirmwareSpecTest
          ./SmbiosDecode
          ./SmbiosDecode.txt
        if-no-files-found: error

  Package:
    if: ${{github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[VERSION] ')}}
    needs: [Build-Managed, Build-Windows-MSVC, Build-Linux-GCC]
    runs-on: windows-latest
    outputs:
      relver: ${{steps.relver.outputs.relver}}
    steps:
    - name: Source checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Verify release version
      id: relver
      shell: pwsh
      env:
        COMMIT_MESSAGE: ${{github.event.head_commit.message}}
      run: |
        $Prefix = '[VERSION] '
        $Message = $env:COMMIT_MESSAGE
        if (!$Message.StartsWith($Prefix, [StringComparison]::Ordinal)) {
          throw 'The commit message is not a version release message.'
        }

        $ReleaseVersion = $Message.Substring($Prefix.Length)
        if ($ReleaseVersion -cnotmatch '\A(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?\z') {
          throw "Invalid release version: $ReleaseVersion"
        }

        [xml]$Project = Get-Content -LiteralPath .\Managed\KNSoft.FirmwareSpec\KNSoft.FirmwareSpec.csproj
        $PackageVersion = [string]$Project.Project.PropertyGroup.Version
        if ($PackageVersion -cne $ReleaseVersion) {
          throw "Release version '$ReleaseVersion' does not match project version '$PackageVersion'."
        }

        Write-Output "relver=$ReleaseVersion" >> $env:GITHUB_OUTPUT
    - name: Prepare .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: Build and analyze
      run: dotnet build .\Managed\KNSoft.FirmwareSpec.Tests\KNSoft.FirmwareSpec.Tests.csproj -c Release
    - name: Run tests
      run: dotnet run --project .\Managed\KNSoft.FirmwareSpec.Tests\KNSoft.FirmwareSpec.Tests.csproj -c Release --no-build
    - name: Create NuGet package
      run: dotnet pack .\Managed\KNSoft.FirmwareSpec\KNSoft.FirmwareSpec.csproj -c Release --no-build --output .\artifacts
    - name: Upload NuGet package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: NuGet-package
        path: ./artifacts/KNSoft.FirmwareSpec.${{steps.relver.outputs.relver}}.nupkg
        if-no-files-found: error
        retention-days: 1

  Publish:
    needs: Package
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest
    steps:
    - name: Download NuGet package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: NuGet-package
        path: ./artifacts
    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: Ratin
    - name: Publish NuGet package
      shell: pwsh
      env:
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
        PACKAGE_VERSION: ${{needs.Package.outputs.relver}}
      run: |
        $PackagePath = Join-Path $PWD "artifacts\KNSoft.FirmwareSpec.$env:PACKAGE_VERSION.nupkg"
        if (!(Test-Path -LiteralPath $PackagePath -PathType Leaf)) {
          throw "NuGet package not found: $PackagePath"
        }

        & dotnet nuget push $PackagePath --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
    - name: Create release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: v${{needs.Package.outputs.relver}}
        tag_name: v${{needs.Package.outputs.relver}}
        body: "**NuGet Package**: https://www.nuget.org/packages/KNSoft.FirmwareSpec/${{needs.Package.outputs.relver}}"
        prerelease: ${{contains(needs.Package.outputs.relver, '-')}}
        preserve_order: true
        fail_on_unmatched_files: true
        generate_release_notes: true
        files: ./artifacts/KNSoft.FirmwareSpec.${{needs.Package.outputs.relver}}.nupkg
